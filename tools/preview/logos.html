<!doctype html><meta charset="utf-8"><title>Logo variants</title>
<style>body{background:#2a2725;margin:0;padding:24px;display:flex;gap:28px;flex-wrap:wrap;font:13px system-ui;color:#ddd}figure{margin:0;display:grid;gap:8px;justify-items:center}img.big{width:180px}.row{display:flex;gap:10px;align-items:end}img.s32{width:32px}img.s16{width:16px}</style>
<script>for (const n of ["italic-dot","roman","italic-light","inverse"]) document.write(`<figure><img class=big src="/assets/logo-variants/${n}.svg"><div class=row><img class=s32 src="/assets/logo-variants/${n}.svg"><img class=s16 src="/assets/logo-variants/${n}.svg"></div><figcaption>${n}</figcaption></figure>`)</script>
