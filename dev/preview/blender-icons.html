<!doctype html><meta charset="utf-8"><title>Blender icons</title>
<style>body{background:#1e1f22;margin:0;padding:18px;display:flex;gap:16px;flex-wrap:wrap;font:13px system-ui;color:#ccc}figure{margin:0;display:grid;gap:6px;justify-items:center}img{width:128px;border-radius:10px}.s{width:40px;border-radius:50%}figcaption{max-width:130px;text-align:center}</style>
<script>

</script>
