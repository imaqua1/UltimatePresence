<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UltimatePresence UI preview</title>
  <!-- Mock bridge first, then the real window's markup, styles and scripts from /ui/. -->
  <script src="/dev/preview/mock-tauri.js"></script>
</head>
<body>
  <script>
    (async () => {
      const html = await (await fetch("/ui/index.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const base = document.createElement("base");
      base.href = "/ui/";
      document.head.prepend(base);
      for (const link of doc.head.querySelectorAll("link[rel=stylesheet]")) document.head.append(link.cloneNode());
      const scripts = [...doc.querySelectorAll("script[src]")].map((s) => s.getAttribute("src"));
      doc.querySelectorAll("script").forEach((s) => s.remove());
      document.body.innerHTML = doc.body.innerHTML;
      for (const src of scripts) {
        await new Promise((resolve) => {
          const el = document.createElement("script");
          el.src = src;
          el.onload = el.onerror = resolve;
          document.body.append(el);
        });
      }
    })();
  </script>
</body>
</html>
