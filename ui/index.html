<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UltimatePresence</title>
  <link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <!-- Icon set: stroked glyphs on a 20×20 grid. App glyphs are abstract, not brand logos. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 20 20"><path d="M3.5 9 10 3.5 16.5 9v7a.5.5 0 0 1-.5.5h-3.5V12h-5v4.5H4a.5.5 0 0 1-.5-.5z"/></symbol>
      <symbol id="i-now" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.2" fill="currentColor" stroke="none"/><path d="M6.2 13.8a5.4 5.4 0 0 1 0-7.6M13.8 6.2a5.4 5.4 0 0 1 0 7.6M3.6 16.4a9 9 0 0 1 0-12.8M16.4 3.6a9 9 0 0 1 0 12.8"/></symbol>
      <symbol id="i-settings" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M17.5 10h-2.2M4.7 10H2.5M15.3 4.7l-1.6 1.6M6.3 13.7l-1.6 1.6M15.3 15.3l-1.6-1.6M6.3 6.3 4.7 4.7"/></symbol>
      <symbol id="i-log" viewBox="0 0 20 20"><path d="M7 5.5h9M7 10h9M7 14.5h6"/><circle cx="4" cy="5.5" r=".9" fill="currentColor"/><circle cx="4" cy="10" r=".9" fill="currentColor"/><circle cx="4" cy="14.5" r=".9" fill="currentColor"/></symbol>
      <symbol id="i-cube" viewBox="0 0 20 20"><path d="M10 2.8 16.3 6.4v7.2L10 17.2l-6.3-3.6V6.4z"/><path d="M3.7 6.4 10 10l6.3-3.6M10 10v7.2"/></symbol>
      <symbol id="i-mesh" viewBox="0 0 20 20"><path d="M10 3.5 16.5 15h-13z"/><path d="M10 3.5 10 11.2 3.5 15M10 11.2 16.5 15"/><circle cx="10" cy="11.2" r="1.3" fill="currentColor"/></symbol>
      <symbol id="i-pen" viewBox="0 0 20 20"><path d="M10 2.8 14.6 9 12.4 16.5H7.6L5.4 9z"/><path d="M10 2.8V9.6"/><circle cx="10" cy="10.6" r="1.3"/><path d="M7.6 16.5h4.8"/></symbol>
      <symbol id="i-brush" viewBox="0 0 20 20"><path d="M16.5 3.5 9.2 10.8"/><path d="M9.2 10.8c1 1 1 2.6 0 3.6-1.3 1.3-3.7 1.6-5.7 1.1.9-.8 1-1.9 1.3-3 .3-1.2.9-2 1.7-2.4 1-.4 2-.2 2.7.7z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 20 20"><path d="m8 5 5 5-5 5"/></symbol>
      <symbol id="i-external" viewBox="0 0 20 20"><path d="M8 4.5H4.5v11h11V12M11 4.5h4.5V9M15.5 4.5 9 11"/></symbol>
      <symbol id="i-pause" viewBox="0 0 20 20"><path d="M7.5 5v10M12.5 5v10"/></symbol>
      <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.8v10.4L15 10z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 20 20"><path d="M10 3 17.5 16h-15z"/><path d="M10 8.2v3.6"/><circle cx="10" cy="13.9" r=".8" fill="currentColor"/></symbol>
      <symbol id="i-moon" viewBox="0 0 20 20"><path d="M15.5 12.2A6 6 0 0 1 7.8 4.5a6 6 0 1 0 7.7 7.7z"/></symbol>
      <symbol id="i-x" viewBox="0 0 20 20"><path d="m6 6 8 8M14 6l-8 8"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 20 20"><path d="M10 3.5c.6 3.2 2.3 4.9 5.5 5.5-3.2.6-4.9 2.3-5.5 5.5-.6-3.2-2.3-4.9-5.5-5.5 3.2-.6 4.9-2.3 5.5-5.5z"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <nav class="sidebar" aria-label="Sections">
      <div class="brand">
        <img src="icon.svg" alt="" width="42" height="42">
        <span class="wordmark">Ultimate<span class="serif">Presence</span></span>
      </div>

      <div class="nav">
        <button class="nav-item" data-route="home" type="button" title="Home">
          <svg class="icon"><use href="#i-home"/></svg>
          <span class="nav-text"><span class="nav-name">Home</span></span>
        </button>
      </div>

      <p class="nav-label" id="apps-heading">Apps</p>
      <div class="nav" id="nav-apps" role="group" aria-labelledby="apps-heading"></div>

      <div class="nav-bottom">
        <button class="nav-item" data-route="settings" type="button" title="Settings">
          <svg class="icon"><use href="#i-settings"/></svg>
          <span class="nav-text"><span class="nav-name">Settings</span></span>
        </button>
        <button class="nav-item" data-route="log" type="button" title="Activity log">
          <svg class="icon"><use href="#i-log"/></svg>
          <span class="nav-text"><span class="nav-name">Activity log</span></span>
          <span class="nav-count" id="nav-log-count" hidden></span>
        </button>

        <div class="me" aria-live="polite">
          <span class="avatar" id="me-avatar">?</span>
          <span class="me-text">
            <span class="me-name" id="me-name">Discord</span>
            <span class="me-state" id="me-state">Connecting…</span>
          </span>
          <button class="icon-btn" id="me-pause" type="button" aria-label="Pause sharing" title="Pause sharing">
            <svg class="icon"><use href="#i-pause"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
